[package]
name = "ylong_https_proxy"
version = "1.0.0"
edition = "2024"
description = "High-performance asynchronous HTTPS proxy module in Rust"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full", "tracing"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
rustls = { version = "0.23", features = ["ring", "logging", "std"] }
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
http = "1.1"
url = "2.5"
base64 = "0.22"
webpki-roots = "0.26"
deadpool = { version = "0.12", features = ["rt_tokio_1"] }
async-trait = "0.1"
tracing = "0.1"
thiserror = "2.0"

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["async_tokio"] }
assert2 = "0.3"
mockall = "0.13"
futures = "0.3"

[[bench]]
name = "proxy_benchmark"
harness = false

[[bin]]
name = "perf_bench"
path = "src/bin/perf_bench.rs"
